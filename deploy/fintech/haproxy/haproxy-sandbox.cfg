# The sandbox edge: sandbox.api.domain.com and sandbox.auth.domain.com, in its own HAProxy
# Deployment and Service (own IP, own certificates). Sandbox tokens come from the sandbox IdP, so
# a prod token is never accepted here (different issuer, different key), and the reverse.

global
    log stdout format raw local0 info
    stats socket /var/run/haproxy/admin.sock mode 600 level admin
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-load-extra-files key

resolvers k8s
    parse-resolv-conf
    hold valid 10s
    accepted_payload_size 8192

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout http-request 30s
    timeout http-keep-alive 120s
    timeout server 15s
    retries 1
    retry-on conn-failure
    option redispatch
    default-server init-addr last,libc,none resolvers k8s check inter 5s fall 3 rise 2

backend st_ip
    stick-table type ip size 100k expire 2m store http_req_rate(1m)

frontend health
    bind :8404
    monitor-uri /healthz

frontend http
    bind :8080
    http-request redirect scheme https code 301

frontend https
    bind :8443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-request del-header x-forwarded-for
    http-request del-header x-client-id
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    acl host_api  var(txn.host) -m str sandbox.api.domain.com
    acl host_auth var(txn.host) -m str sandbox.auth.domain.com
    http-request return status 421 if { ssl_fc_sni -m found } !{ ssl_fc_sni,lower,strcmp(txn.host) eq 0 }

    http-request track-sc0 src table st_ip
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_ip) gt 600 }

    # Any valid sandbox token. Algorithm pinned to RS256 (see haproxy.cfg for why).
    http-request set-var(txn.jwt) http_auth_bearer
    acl jwt_present var(txn.jwt) -m found
    http-request set-var(txn.jwt_alg)  var(txn.jwt),jwt_header_query('$.alg') if jwt_present
    http-request set-var(txn.jwt_sig)  var(txn.jwt),jwt_verify("RS256","/etc/haproxy/jwt/sandbox-auth.pem") if jwt_present
    http-request set-var(txn.iss)      var(txn.jwt),jwt_payload_query('$.iss') if jwt_present
    http-request set-var(txn.aud)      var(txn.jwt),jwt_payload_query('$.aud') if jwt_present
    http-request set-var(txn.exp)      var(txn.jwt),jwt_payload_query('$.exp','int') if jwt_present
    http-request set-var(txn.clientid) var(txn.jwt),jwt_payload_query('$.client_id') if jwt_present
    http-request set-var(txn.now)      date
    http-request set-var(txn.jwt_ok) bool(1) if jwt_present { var(txn.jwt_alg) -m str RS256 } { var(txn.jwt_sig) -m int 1 } { var(txn.iss) -m str https://sandbox.auth.domain.com } { var(txn.exp),sub(txn.now) gt 0 }
    acl v1 path_beg /v1/
    http-request return status 401 content-type application/json string '{"error":"invalid_token"}' hdr WWW-Authenticate Bearer if host_api v1 !{ var(txn.jwt_ok) -m bool }
    http-request deny deny_status 403 if host_api v1 !{ var(txn.aud) -m str sandbox.api.domain.com }
    http-request set-header X-Client-Id %[var(txn.clientid)] if host_api v1

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff

    use_backend auth_server if host_auth
    use_backend customers   if host_api { path_beg /v1/customers }
    use_backend accounts    if host_api { path_beg /v1/products /v1/accounts /v1/beneficiaries }
    use_backend ledger      if host_api { path_beg /v1/ledger }
    default_backend not_found

backend not_found
    http-request return status 404 content-type application/json string '{"error":"not_found"}'
backend auth_server
    server s auth-server.sandbox.svc.cluster.local:80
backend customers
    timeout server 55s
    server s customers.sandbox.svc.cluster.local:80
backend accounts
    server s accounts.sandbox.svc.cluster.local:80
backend ledger
    server s ledger.sandbox.svc.cluster.local:80
