# The prod edge for domain.com, as one HAProxy configuration (HAProxy 3.0).
# The same rules as ../envoy (Gateway API + Envoy Gateway), written in HAProxy's own language.
# Mounted from a ConfigMap (kustomization.yaml); see README.md for what each part does and how
# it was tested.
#
# Hosts: domain.com, docs., auth., api., console.domain.com. Sandbox runs in its own HAProxy
# (haproxy-sandbox.cfg), so it never shares a process, IP or certificate with prod.

global
    log stdout format raw local0 info
    stats socket /var/run/haproxy/admin.sock mode 600 level admin   # runtime API (add/remove servers, ...)
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-load-extra-files key          # api.domain.com.pem + api.domain.com.pem.key, as Secrets provide them
    tune.bufsize 65536

# Service names are resolved through the cluster DNS (read from /etc/resolv.conf in the Pod).
resolvers k8s
    parse-resolv-conf
    hold valid 10s
    accepted_payload_size 8192

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout http-request 30s          # a whole request must arrive within 30 s (slowloris)
    timeout http-keep-alive 120s
    timeout server 15s                # default request timeout; longer per path below
    timeout queue 10s
    retries 1
    retry-on conn-failure             # never retry a request the backend may have processed
    option redispatch
    default-server init-addr last,libc,none resolvers k8s check inter 5s fall 3 rise 2

# ---------------------------------------------------------------------------------------------
# Rate-limit tables (counted per HAProxy replica, like Envoy's "Local" limits)
# ---------------------------------------------------------------------------------------------
backend st_user_all
    stick-table type string len 128 size 200k expire 2m store http_req_rate(1m)
backend st_user_moneyout
    stick-table type string len 128 size 200k expire 2m store http_req_rate(1m)
backend st_partner
    stick-table type string len 128 size 50k expire 2m store http_req_rate(1m)
backend st_ip_public
    stick-table type ip size 200k expire 2m store http_req_rate(1m)
backend st_ip_auth
    stick-table type ip size 200k expire 2m store http_req_rate(1m)
backend st_ip_console_login
    stick-table type ip size 50k expire 2m store http_req_rate(1m)

# ---------------------------------------------------------------------------------------------
# Probes for Kubernetes (readiness/liveness) on a separate port
# ---------------------------------------------------------------------------------------------
frontend health
    bind :8404
    monitor-uri /healthz

# ---------------------------------------------------------------------------------------------
# Port 80 (Service :80 -> 8080): everything goes to HTTPS
# ---------------------------------------------------------------------------------------------
frontend http
    bind :8080
    http-request redirect scheme https code 301

# ---------------------------------------------------------------------------------------------
# Port 443 (Service :443 -> 8443)
# ---------------------------------------------------------------------------------------------
frontend https
    # One certificate per host in this directory, picked by SNI. Separate certificates (not one
    # with every name) avoid HTTP/2 connection coalescing across hosts; the 421 rule below is a
    # second guard.
    bind :8443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1

    # ---- who is the client, what host -------------------------------------------------------
    # The NLB keeps the client's IP (externalTrafficPolicy: Local), so src IS the client.
    # Never trust identity headers a client sends.
    http-request del-header x-forwarded-for
    http-request del-header x-user-id
    http-request del-header x-client-id
    http-request del-header x-staff-id
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower

    acl host_apex    var(txn.host) -m str domain.com
    acl host_docs    var(txn.host) -m str docs.domain.com
    acl host_auth    var(txn.host) -m str auth.domain.com
    acl host_api     var(txn.host) -m str api.domain.com
    acl host_console var(txn.host) -m str console.domain.com

    # A request for one host on a TLS connection opened for another (HTTP/2 coalescing): 421.
    http-request return status 421 if { ssl_fc_sni -m found } !{ ssl_fc_sni,lower,strcmp(txn.host) eq 0 }

    # ---- JWT: parse and verify once ---------------------------------------------------------
    # The algorithm is PINNED to RS256. Never pass the token's own "alg" header to jwt_verify:
    # with alg "none", jwt_verify returns 1 for an unsigned token (tested, see README).
    http-request set-var(txn.jwt) http_auth_bearer
    acl jwt_present  var(txn.jwt) -m found
    http-request set-var(txn.jwt_alg)  var(txn.jwt),jwt_header_query('$.alg') if jwt_present
    http-request set-var(txn.jwt_sig)  var(txn.jwt),jwt_verify("RS256","/etc/haproxy/jwt/auth.pem") if jwt_present
    http-request set-var(txn.iss)      var(txn.jwt),jwt_payload_query('$.iss') if jwt_present
    http-request set-var(txn.aud)      var(txn.jwt),jwt_payload_query('$.aud') if jwt_present
    http-request set-var(txn.exp)      var(txn.jwt),jwt_payload_query('$.exp','int') if jwt_present
    http-request set-var(txn.scope)    var(txn.jwt),jwt_payload_query('$.scope') if jwt_present
    http-request set-var(txn.sub)      var(txn.jwt),jwt_payload_query('$.sub') if jwt_present
    http-request set-var(txn.clientid) var(txn.jwt),jwt_payload_query('$.client_id') if jwt_present
    http-request set-var(txn.amr)      var(txn.jwt),jwt_payload_query('$.amr') if jwt_present
    http-request set-var(txn.now)      date
    acl jwt_alg_ok   var(txn.jwt_alg) -m str RS256
    acl jwt_sig_ok   var(txn.jwt_sig) -m int 1
    acl jwt_iss_ok   var(txn.iss) -m str https://auth.domain.com
    acl jwt_live     var(txn.exp),sub(txn.now) gt 0
    # "valid" = present, RS256, good signature, our issuer, not expired
    http-request set-var(txn.jwt_ok) bool(1) if jwt_present jwt_alg_ok jwt_sig_ok jwt_iss_ok jwt_live
    acl jwt_valid    var(txn.jwt_ok) -m bool

    acl aud_api      var(txn.aud) -m str api.domain.com
    acl aud_app      var(txn.aud) -m str app.domain.com
    acl aud_console  var(txn.aud) -m str console.domain.com
    acl amr_mfa      var(txn.amr) -m sub "\"mfa\""   # amr comes back as JSON text: ["pwd","mfa"]

    # =========================================================================================
    # api.domain.com/v1: partner API. One scope per method + path; everything else is denied.
    # =========================================================================================
    acl v1 path_beg /v1/
    acl sc_customers_read     var(txn.scope) -m reg '(^| )customers[.]read( |$)'
    acl sc_customers_write    var(txn.scope) -m reg '(^| )customers[.]write( |$)'
    acl sc_kyc_read           var(txn.scope) -m reg '(^| )kyc[.]read( |$)'
    acl sc_kyc_write          var(txn.scope) -m reg '(^| )kyc[.]write( |$)'
    acl sc_products_read      var(txn.scope) -m reg '(^| )products[.]read( |$)'
    acl sc_accounts_read      var(txn.scope) -m reg '(^| )accounts[.]read( |$)'
    acl sc_accounts_write     var(txn.scope) -m reg '(^| )accounts[.]write( |$)'
    acl sc_beneficiaries_read  var(txn.scope) -m reg '(^| )beneficiaries[.]read( |$)'
    acl sc_beneficiaries_write var(txn.scope) -m reg '(^| )beneficiaries[.]write( |$)'
    acl sc_ledger_read        var(txn.scope) -m reg '(^| )ledger[.]read( |$)'
    acl sc_ledger_post        var(txn.scope) -m reg '(^| )ledger[.]post( |$)'

    http-request return status 401 content-type application/json string '{"error":"invalid_token"}' hdr WWW-Authenticate Bearer if host_api v1 !jwt_valid
    http-request deny deny_status 403 if host_api v1 !aud_api

    # Customers
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path /v1/customers } sc_customers_write
    http-request set-var(txn.allow) bool(1) if host_api { method PATCH } { path_reg ^/v1/customers/[A-Za-z0-9_-]+$ } sc_customers_write
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path_reg ^/v1/customers/[A-Za-z0-9_-]+:close$ } sc_customers_write
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path_reg ^/v1/customers/[A-Za-z0-9_-]+$ } sc_customers_read
    # KYC/KYB
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path_reg ^/v1/customers/[A-Za-z0-9_-]+/kyc-intents$ } sc_kyc_write
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path_reg ^/v1/customers/[A-Za-z0-9_-]+/kyc-intents/[A-Za-z0-9_-]+/documents$ } sc_kyc_write
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path_reg ^/v1/customers/[A-Za-z0-9_-]+/kyc-intents/[A-Za-z0-9_-]+$ } sc_kyc_read
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path_reg ^/v1/customers/[A-Za-z0-9_-]+/screenings$ } sc_kyc_read
    # Products
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path_reg ^/v1/products(/[A-Za-z0-9_-]+)?$ } sc_products_read
    # Accounts, balances, statements
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path /v1/accounts } sc_accounts_write
    http-request set-var(txn.allow) bool(1) if host_api { method PATCH } { path_reg ^/v1/accounts/[A-Za-z0-9_-]+$ } sc_accounts_write
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path_reg ^/v1/accounts/[A-Za-z0-9_-]+:close$ } sc_accounts_write
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path_reg ^/v1/accounts(/[A-Za-z0-9_-]+(/balance|/statements)?)?$ } sc_accounts_read
    # Beneficiaries
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path /v1/beneficiaries } sc_beneficiaries_write
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path /v1/beneficiaries } sc_beneficiaries_read
    # Ledger (ledger.post: issue only to internal or privileged partners)
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path_reg ^/v1/ledger/accounts/[A-Za-z0-9_-]+/transactions$ } sc_ledger_read
    http-request set-var(txn.allow) bool(1) if host_api METH_GET { path_reg ^/v1/ledger/journals/[A-Za-z0-9_-]+$ } sc_ledger_read
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path /v1/ledger/journals } sc_ledger_post
    http-request set-var(txn.allow) bool(1) if host_api METH_POST { path_reg ^/v1/ledger/journals/[A-Za-z0-9_-]+:reverse$ } sc_ledger_post

    http-request deny deny_status 403 if host_api v1 !{ var(txn.allow) -m bool }

    http-request set-header X-Client-Id %[var(txn.clientid)] if host_api v1
    http-request track-sc0 var(txn.clientid) table st_partner if host_api v1
    http-request deny deny_status 429 if host_api v1 { sc_http_req_rate(0,st_partner) gt 1200 }

    # =========================================================================================
    # api.domain.com, unversioned: first-party app API (end-user tokens)
    # =========================================================================================
    acl kiosk_lookup path_reg ^/kiosks(/[^/]+)?$
    acl plaid_hook   path /webhooks/plaid
    acl app_paths    path_beg /cards /wallets /transactions /trades /crypto /fiat /plaid /kyc
    acl kiosk_ops    path_reg ^/kiosks/[^/]+/(deposit|withdraw|transactions)$
    acl money_out    path_reg ^/(crypto/withdraw|fiat/withdraw|trades/(buy|sell)|kiosks/[^/]+/withdraw)$

    # Public: kiosk lookups (GET) and Plaid's webhook (POST). bank-link MUST verify Plaid-Verification.
    http-request set-var(txn.public) bool(1) if host_api !v1 METH_GET kiosk_lookup
    http-request set-var(txn.public) bool(1) if host_api !v1 METH_POST plaid_hook
    http-request track-sc1 src table st_ip_public if { var(txn.public) -m bool }
    http-request deny deny_status 429 if { var(txn.public) -m bool } { sc_http_req_rate(1,st_ip_public) gt 120 }

    # Protected: everything else on these paths needs a valid end-user token.
    http-request set-var(txn.app) bool(1) if host_api !v1 app_paths
    http-request set-var(txn.app) bool(1) if host_api !v1 kiosk_ops
    http-request return status 401 content-type application/json string '{"error":"invalid_token"}' hdr WWW-Authenticate Bearer if { var(txn.app) -m bool } !jwt_valid
    http-request deny deny_status 403 if { var(txn.app) -m bool } !aud_app
    http-request set-header X-User-Id %[var(txn.sub)] if { var(txn.app) -m bool }
    http-request track-sc1 var(txn.sub) table st_user_all if { var(txn.app) -m bool }
    http-request deny deny_status 429 if { var(txn.app) -m bool } { sc_http_req_rate(1,st_user_all) gt 300 }
    http-request track-sc2 var(txn.sub) table st_user_moneyout if { var(txn.app) -m bool } money_out
    http-request deny deny_status 429 if { var(txn.app) -m bool } money_out { sc_http_req_rate(2,st_user_moneyout) gt 10 }

    # =========================================================================================
    # console.domain.com: office/VPN only; the admin API also needs a staff token with MFA.
    # 203.0.113.0/24 and 198.51.100.0/24 are placeholders for the office and VPN ranges.
    # =========================================================================================
    acl office_or_vpn src 203.0.113.0/24 198.51.100.0/24
    acl admin_login   path_beg /admin/auth
    acl admin_api     path_beg /admin
    http-request deny deny_status 403 if host_console !office_or_vpn
    http-request track-sc1 src table st_ip_console_login if host_console admin_login
    http-request deny deny_status 429 if host_console admin_login { sc_http_req_rate(1,st_ip_console_login) gt 20 }
    http-request return status 401 content-type application/json string '{"error":"invalid_token"}' hdr WWW-Authenticate Bearer if host_console admin_api !admin_login !jwt_valid
    http-request deny deny_status 403 if host_console admin_api !admin_login !aud_console
    http-request deny deny_status 403 if host_console admin_api !admin_login !amr_mfa
    http-request set-header X-Staff-Id %[var(txn.sub)] if host_console admin_api !admin_login

    # =========================================================================================
    # auth.domain.com: rate limit per client IP
    # =========================================================================================
    http-request track-sc1 src table st_ip_auth if host_auth
    http-request deny deny_status 429 if host_auth { sc_http_req_rate(1,st_ip_auth) gt 300 }

    # ---- security headers on every response ---------------------------------------------------
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY if { var(txn.host) -m str console.domain.com }
    http-response del-header Server
    http-response del-header X-Powered-By

    # ---- where each request goes ---------------------------------------------------------------
    use_backend web_site        if host_apex
    use_backend web_docs        if host_docs
    use_backend auth_server     if host_auth
    use_backend partner_customers if host_api { path_beg /v1/customers }
    use_backend partner_accounts  if host_api { path_beg /v1/products /v1/accounts /v1/beneficiaries }
    use_backend ledger            if host_api { path_beg /v1/ledger }
    use_backend app_cards       if host_api { path_beg /cards }
    use_backend app_wallets     if host_api { path_beg /wallets /transactions }
    use_backend app_trading     if host_api { path_beg /trades }
    use_backend app_crypto      if host_api { path_beg /crypto }
    use_backend app_fiat        if host_api { path_beg /fiat }
    use_backend app_bank_link   if host_api { path_beg /plaid }
    use_backend app_bank_link   if host_api METH_POST plaid_hook
    use_backend app_kyc         if host_api { path_beg /kyc }
    use_backend app_kiosks      if host_api kiosk_ops
    use_backend app_kiosks      if host_api METH_GET kiosk_lookup
    use_backend console_admin   if host_console admin_api
    use_backend console_ui      if host_console
    default_backend not_found

# ---------------------------------------------------------------------------------------------
# Backends: one per Kubernetes Service, by its cluster DNS name. HAProxy connects to the Service's
# ClusterIP, and kube-proxy picks a Pod (unlike Envoy Gateway, which connects to Pod IPs).
# ---------------------------------------------------------------------------------------------
backend not_found
    http-request return status 404 content-type application/json string '{"error":"not_found"}'
backend web_site
    server s site.web.svc.cluster.local:80
backend web_docs
    server s docs.web.svc.cluster.local:80
backend auth_server
    server s auth-server.auth.svc.cluster.local:80
backend partner_customers
    timeout server 55s                                         # KYC document uploads
    server s customers.partner-api.svc.cluster.local:80
backend partner_accounts
    http-request set-timeout server 55s if { path_reg ^/v1/accounts/[A-Za-z0-9_-]+/statements$ }   # PDF/CSV
    server s accounts.partner-api.svc.cluster.local:80
backend ledger
    server s ledger.ledger.svc.cluster.local:80
backend app_cards
    server s cards.app-api.svc.cluster.local:80
backend app_wallets
    server s wallets.app-api.svc.cluster.local:80
backend app_trading
    server s trading.app-api.svc.cluster.local:80
backend app_crypto
    server s crypto.app-api.svc.cluster.local:80
backend app_fiat
    server s fiat.app-api.svc.cluster.local:80
backend app_bank_link
    server s bank-link.app-api.svc.cluster.local:80
backend app_kyc
    timeout server 55s                                         # document and selfie uploads
    server s kyc.app-api.svc.cluster.local:80
backend app_kiosks
    server s kiosks.app-api.svc.cluster.local:80
backend console_admin
    server s admin-api.console.svc.cluster.local:80
backend console_ui
    server s console-ui.console.svc.cluster.local:80
