# The ledger: from HAProxy (partner /v1/ledger) and from the app and partner services, which post
# journals internally.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: edge-and-internal-posters, namespace: ledger}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: edge}}
          podSelector: {matchLabels: {app.kubernetes.io/name: haproxy-edge}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: app-api}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: partner-api}}
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: from-haproxy-sandbox-only, namespace: sandbox}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: edge}}
          podSelector: {matchLabels: {app.kubernetes.io/name: haproxy-sandbox}}
      ports: [{port: 8080}]
    - from: [{podSelector: {}}]
      ports: [{port: 8080}]
