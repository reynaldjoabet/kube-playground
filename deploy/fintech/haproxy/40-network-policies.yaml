# Inside the cluster, only HAProxy's Pods may reach each surface, so nothing can skip the JWT,
# scope and IP checks in haproxy.cfg. HAProxy connects to the Services' ClusterIPs; kube-proxy
# then sends to a Pod, keeping HAProxy's Pod IP as the source, so these selectors match it.
# Ports are the Pods' port (8080), as in ../envoy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: from-haproxy-edge-only, namespace: web}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: edge}}
          podSelector: {matchLabels: {app.kubernetes.io/name: haproxy-edge}}
      ports: [{port: 8080}]
---
