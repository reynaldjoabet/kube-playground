---
# The ledger: from the prod Gateway (partner /v1/ledger) and from the app and partner services,
# which post journals internally (wallet transfers, trades, deposits).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-and-internal-posters, namespace: ledger}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}}
          podSelector: {matchLabels: {gateway.envoyproxy.io/owning-gateway-name: prod, gateway.envoyproxy.io/owning-gateway-namespace: infra}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: app-api}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: partner-api}}
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: from-sandbox-gateway-only, namespace: sandbox}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}}
          podSelector: {matchLabels: {gateway.envoyproxy.io/owning-gateway-name: sandbox, gateway.envoyproxy.io/owning-gateway-namespace: infra}}
      ports: [{port: 8080}]
    - from: [{podSelector: {}}] # sandbox services may call each other (customers -> ledger, ...)
      ports: [{port: 8080}]
