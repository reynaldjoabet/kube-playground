hetzner_token: <your-token>
cluster_name: production
kubeconfig_path: "./kubeconfig"
k3s_version: v1.32.0+k3s1

networking:
  ssh:
    port: 22
    use_agent: false
    public_key_path: "~/.ssh/id_ed25519.pub"
    private_key_path: "~/.ssh/id_ed25519"
  allowed_networks:
    ssh:
      - <your-ip>/32        # Restrict SSH to your IP
    api:
      - <your-ip>/32        # Restrict API access to your IP
  cni: cilium               # Advanced networking (or flannel for simplicity)

# 3 masters across different locations for HA
masters_pool:
  instance_type: cpx32
  instance_count: 3
  locations:
    - fsn1
    - hel1
    - nbg1

worker_node_pools:
  # General-purpose workers
  - name: general
    instance_type: cpx32
    instance_count: 3
    location: fsn1

  # Autoscaling pool for variable workloads
  - name: autoscaled
    instance_type: cpx32
    location: fsn1
    autoscaling:
      enabled: true
      min_instances: 2
      max_instances: 10

  # Optional: cost-effective ARM workers
  - name: arm-workers
    instance_type: cax21
    instance_count: 2
    location: fsn1